title: Notebook
description: >-
  A curated, public counterpart to a private personal notebook — selected
  topics only, published as they're ready.

url: "https://rangeeth.github.io"
baseurl: "/notebook-site"

theme: just-the-docs

# --- Just the Docs settings ---
color_scheme: slate
search_enabled: true
search:
  heading_level: 2
  previews: 2
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"
nav_sort: case_insensitive
nav_external_links:
  opacity: 0.7

footer_content: >-
  Personal notes, not professional or organizational advice. Views are my
  own and may change as I learn more.

callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  caution:
    title: Caution
    color: yellow

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
  - node_modules/
